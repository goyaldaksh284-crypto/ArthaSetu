# ===========================================================================
# Render Blueprint Specification for ArthaSetu Backend (Free Tier)
# ===========================================================================
services:
  - type: web
    name: arthasetu-api
    env: python
    plan: free
    region: oregon
    buildCommand: UV_LINK_MODE=copy pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: UV_LINK_MODE
        value: copy
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:8080,http://localhost:5173"
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      - key: GROQ_MODEL_FALLBACK
        value: "openai/gpt-oss-120b"
